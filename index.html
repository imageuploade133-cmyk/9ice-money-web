<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>9iceMoney - Personal &amp; Business Banking</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    :root {
      --hero-blue: #3738e9;
      --hero-yellow: #ffdc55;
      --white: #fff;
    }

    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--hero-yellow) #2526bd;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #2526bd;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--hero-yellow);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ffe477;
    }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--hero-blue);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    .hero-page { min-height: 100vh; background: var(--hero-blue); color: var(--white); overflow: hidden; position: relative; }
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.05fr);
      align-items: center;
      width: min(100%, 1800px);
      min-height: 600px;
      max-height: 750px;
      margin-inline: auto;
      padding: 40px clamp(24px, 4vw, 80px);
      isolation: isolate;
    }
    .hero-copy { position: relative; z-index: 2; max-width: 680px; padding-block: 10px; }
    .eyebrow {
      display: inline-block;
      margin: 0 0 20px;
      padding-bottom: 8px;
      border-bottom: 3px dashed var(--hero-yellow);
      font-size: clamp(13px, 1.2vw, 18px);
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .eyebrow span { padding-inline: 3px; }
    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(24px, 2.2vw, 38px);
      line-height: 1.25;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    .hero-description {
      max-width: 540px;
      margin: 18px 0 0;
      font-size: clamp(14px, 1.1vw, 18px);
      line-height: 1.5;
      letter-spacing: -0.01em;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.92);
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
      min-height: 48px;
      margin-top: 28px;
      padding: 12px 28px;
      border-radius: 999px;
      background: var(--hero-yellow);
      color: #090909;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
    }
    .cta:hover { transform: translateY(-3px); background: #ffe477; box-shadow: 0 12px 28px #1717a544; }
    .cta:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    .hero-art {
      position: absolute;
      z-index: 1;
      top: 2%;
      right: 3.5%;
      width: 48.5%;
      height: 96%;
      overflow: hidden;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center right;
    }
    .scribble { position: absolute; z-index: 0; color: #7778ff; opacity: .55; font-family: Georgia, serif; font-weight: 400; pointer-events: none; }
    .scribble-top { top: -5px; right: 42%; font-size: 90px; transform: rotate(25deg); color: #2526bd; }
    .scribble-bottom { bottom: -25px; left: 26%; font-size: 150px; transform: rotate(35deg); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (min-width: 1600px) {
      .hero-art { right: 4%; width: 47%; }
    }
    @media (max-width: 1050px) {
      .hero { grid-template-columns: 1fr 0.85fr; padding-inline: 5vw; max-height: none; }
      .hero-art { right: 2.5%; width: 46%; }
      .eyebrow { white-space: normal; }
      .cta { min-width: 205px; min-height: 56px; }
    }
    @media (max-width: 760px) {
      .hero { display: flex; flex-direction: column; align-items: stretch; min-height: auto; max-height: none; padding: 36px 20px 28px; gap: 20px; }
      .hero-copy { padding: 0; }
      .eyebrow { margin-bottom: 18px; padding-bottom: 6px; border-bottom-width: 3px; font-size: clamp(13px, 3.4vw, 16px); }
      h1 { max-width: 100%; font-size: clamp(24px, 6.5vw, 34px); line-height: 1.2; letter-spacing: -0.03em; }
      .hero-description { margin-top: 16px; font-size: 15px; line-height: 1.45; }
      .cta { min-width: 160px; min-height: 46px; margin-top: 22px; padding: 12px 24px; font-size: 14px; }
      .hero-art { position: relative; inset: auto; width: 100%; height: auto; aspect-ratio: 0.96 / 1; border-radius: 20px; }
      .hero-image { object-position: center; }
      .scribble-top { top: 44%; right: 5%; font-size: 65px; }
      .scribble-bottom { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<main class="hero-page" style="min-height: auto; height: auto;">
<section aria-labelledby="hero-title" class="hero" style="min-height: auto; max-height: none; padding-top: 48px; padding-bottom: 48px;">
<div class="hero-copy">
<p class="eyebrow">Personal Banking <span aria-hidden="true" class="">|</span> Business Banking</p>
<h1 id="hero-title" class="">
          Send money, pay bills, and take control of your finances with a seamless banking experience built for everyday life
        </h1>
<p class="hero-description">
          One platform for transfers, payments, and everyday financial services.
        </p>
<a class="cta" href="#get-started">Get started</a>
</div>
<div aria-label="9iceMoney mobile banking and POS devices" class="hero-art" style="position: relative; top: auto; right: auto; width: 100%; height: auto; max-height: 600px;">

</div>


</section>

</main>


</body></html>
